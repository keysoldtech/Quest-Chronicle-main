<!DOCTYPE html>
<html>
<head>
    <title>Generate Free Sprites</title>
    <style>
        body { 
            font-family: monospace; 
            padding: 20px; 
            background: #1a1a1a; 
            color: #fff;
        }
        canvas { 
            border: 2px solid #444; 
            margin: 10px; 
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .sprite-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .sprite-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            margin: 5px;
        }
        button:hover {
            background: #45a049;
        }
        .download-all {
            background: #2196F3;
        }
        .download-all:hover {
            background: #0b7dda;
        }
    </style>
</head>
<body>
    <h1>🎨 Free Sprite Generator - Quest & Chronicle</h1>
    <p>Generate pixel art sprites for all character classes. No external assets needed!</p>
    
    <button class="download-all" onclick="downloadAll()">📦 Download All Sprites as ZIP</button>
    <button onclick="location.reload()">🔄 Regenerate</button>
    
    <div class="sprite-grid" id="sprite-grid"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        const sprites = {
            // Character classes
            barbarian: { color: '#D32F2F', accent: '#FFB74D', symbol: '⚔️', pattern: 'warrior' },
            warrior: { color: '#1976D2', accent: '#90CAF9', symbol: '🛡️', pattern: 'knight' },
            ranger: { color: '#388E3C', accent: '#A5D6A7', symbol: '🏹', pattern: 'archer' },
            rogue: { color: '#424242', accent: '#9E9E9E', symbol: '🗡️', pattern: 'thief' },
            mage: { color: '#7B1FA2', accent: '#CE93D8', symbol: '🔮', pattern: 'wizard' },
            cleric: { color: '#F57C00', accent: '#FFE082', symbol: '✝️', pattern: 'priest' },
            
            // Common monsters
            goblin: { color: '#558B2F', accent: '#C5E1A5', symbol: '👹', pattern: 'monster' },
            wolf: { color: '#616161', accent: '#BDBDBD', symbol: '🐺', pattern: 'beast' },
            skeleton: { color: '#ECEFF1', accent: '#CFD8DC', symbol: '💀', pattern: 'undead' },
            orc: { color: '#6D4C41', accent: '#A1887F', symbol: '⚔️', pattern: 'brute' },
            spider: { color: '#263238', accent: '#546E7A', symbol: '🕷️', pattern: 'crawler' },
            dragon: { color: '#C62828', accent: '#FFAB91', symbol: '🐉', pattern: 'boss' }
        };

        function drawCharacterSprite(name, config) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            ctx.imageSmoothingEnabled = false;
            
            // Background (transparent)
            ctx.clearRect(0, 0, 64, 64);
            
            // Draw based on pattern
            if (config.pattern.includes('warrior') || config.pattern === 'knight') {
                // Helmet/head
                ctx.fillStyle = config.color;
                ctx.fillRect(20, 12, 24, 20); // Head
                ctx.fillStyle = config.accent;
                ctx.fillRect(24, 16, 4, 8); // Visor
                ctx.fillRect(36, 16, 4, 8);
                
                // Body/armor
                ctx.fillStyle = config.color;
                ctx.fillRect(16, 32, 32, 20); // Torso
                
                // Arms
                ctx.fillRect(12, 36, 8, 16); // Left arm
                ctx.fillRect(44, 36, 8, 16); // Right arm
                
                // Legs
                ctx.fillRect(20, 52, 10, 12);
                ctx.fillRect(34, 52, 10, 12);
                
                // Details
                ctx.fillStyle = config.accent;
                ctx.fillRect(28, 36, 8, 12); // Chest plate
                
            } else if (config.pattern === 'archer') {
                // Hood
                ctx.fillStyle = config.color;
                ctx.fillRect(20, 10, 24, 24); // Hood
                ctx.fillStyle = config.accent;
                ctx.fillRect(26, 18, 12, 10); // Face
                
                // Body
                ctx.fillStyle = config.color;
                ctx.fillRect(20, 34, 24, 18);
                
                // Arms
                ctx.fillRect(14, 36, 10, 16);
                ctx.fillRect(40, 36, 10, 16);
                
                // Legs
                ctx.fillRect(22, 52, 8, 12);
                ctx.fillRect(34, 52, 8, 12);
                
                // Bow
                ctx.fillStyle = config.accent;
                ctx.fillRect(8, 32, 2, 20); // Bow shaft
                
            } else if (config.pattern === 'thief') {
                // Hood/mask
                ctx.fillStyle = config.color;
                ctx.fillRect(22, 12, 20, 22);
                ctx.fillStyle = config.accent;
                ctx.fillRect(26, 20, 4, 4); // Eye 1
                ctx.fillRect(34, 20, 4, 4); // Eye 2
                
                // Body (thin)
                ctx.fillStyle = config.color;
                ctx.fillRect(24, 34, 16, 18);
                
                // Arms
                ctx.fillRect(18, 36, 8, 14);
                ctx.fillRect(38, 36, 8, 14);
                
                // Legs
                ctx.fillRect(24, 52, 6, 12);
                ctx.fillRect(34, 52, 6, 12);
                
                // Dagger
                ctx.fillStyle = config.accent;
                ctx.fillRect(46, 42, 8, 2);
                
            } else if (config.pattern === 'wizard') {
                // Wizard hat
                ctx.fillStyle = config.color;
                ctx.beginPath();
                ctx.moveTo(32, 6);
                ctx.lineTo(20, 20);
                ctx.lineTo(44, 20);
                ctx.closePath();
                ctx.fill();
                
                // Hat brim
                ctx.fillRect(18, 20, 28, 4);
                
                // Face/head
                ctx.fillStyle = config.accent;
                ctx.fillRect(24, 24, 16, 10);
                
                // Robe
                ctx.fillStyle = config.color;
                ctx.fillRect(18, 34, 28, 22);
                
                // Arms (holding staff)
                ctx.fillRect(12, 38, 10, 12);
                ctx.fillRect(42, 38, 10, 12);
                
                // Staff
                ctx.fillStyle = config.accent;
                ctx.fillRect(6, 28, 2, 28);
                ctx.fillRect(4, 28, 6, 4); // Staff orb
                
                // Stars on robe
                ctx.fillRect(26, 40, 3, 3);
                ctx.fillRect(35, 46, 3, 3);
                
            } else if (config.pattern === 'priest') {
                // Hood
                ctx.fillStyle = config.color;
                ctx.fillRect(20, 12, 24, 22);
                
                // Face
                ctx.fillStyle = config.accent;
                ctx.fillRect(26, 20, 12, 10);
                
                // Robe
                ctx.fillStyle = config.color;
                ctx.fillRect(16, 34, 32, 22);
                
                // Arms
                ctx.fillRect(10, 38, 10, 14);
                ctx.fillRect(44, 38, 10, 14);
                
                // Holy symbol (cross)
                ctx.fillStyle = config.accent;
                ctx.fillRect(30, 42, 4, 10);
                ctx.fillRect(28, 46, 8, 4);
                
            } else if (config.pattern === 'monster' || config.pattern === 'beast') {
                // Creature body
                ctx.fillStyle = config.color;
                ctx.fillRect(18, 20, 28, 28);
                
                // Eyes
                ctx.fillStyle = config.accent;
                ctx.fillRect(24, 26, 4, 4);
                ctx.fillRect(36, 26, 4, 4);
                
                // Teeth/mouth
                ctx.fillRect(26, 38, 3, 4);
                ctx.fillRect(30, 38, 3, 4);
                ctx.fillRect(34, 38, 3, 4);
                
                // Limbs
                ctx.fillStyle = config.color;
                ctx.fillRect(14, 44, 6, 12);
                ctx.fillRect(44, 44, 6, 12);
                
            } else if (config.pattern === 'undead') {
                // Skull
                ctx.fillStyle = config.color;
                ctx.fillRect(20, 16, 24, 20);
                
                // Eye sockets
                ctx.fillStyle = '#000';
                ctx.fillRect(24, 22, 6, 6);
                ctx.fillRect(34, 22, 6, 6);
                
                // Teeth
                ctx.fillRect(24, 32, 3, 4);
                ctx.fillRect(28, 32, 3, 4);
                ctx.fillRect(32, 32, 3, 4);
                ctx.fillRect(36, 32, 3, 4);
                
                // Ribcage
                ctx.fillStyle = config.color;
                ctx.fillRect(22, 36, 20, 16);
                ctx.fillStyle = '#000';
                for (let i = 0; i < 4; i++) {
                    ctx.fillRect(26, 38 + i * 3, 12, 2);
                }
                
                // Bones (legs)
                ctx.fillStyle = config.color;
                ctx.fillRect(24, 52, 6, 12);
                ctx.fillRect(34, 52, 6, 12);
                
            } else if (config.pattern === 'boss') {
                // Large head/body
                ctx.fillStyle = config.color;
                ctx.fillRect(16, 14, 32, 32);
                
                // Eyes (glowing)
                ctx.fillStyle = '#FF0000';
                ctx.fillRect(22, 22, 6, 6);
                ctx.fillRect(36, 22, 6, 6);
                
                // Horns
                ctx.fillStyle = config.accent;
                ctx.fillRect(14, 14, 4, 10);
                ctx.fillRect(46, 14, 4, 10);
                
                // Mouth/fangs
                ctx.fillStyle = '#FFF';
                ctx.fillRect(24, 36, 4, 6);
                ctx.fillRect(36, 36, 4, 6);
                
                // Wings (suggested)
                ctx.fillStyle = config.color;
                ctx.fillRect(6, 24, 10, 16);
                ctx.fillRect(48, 24, 10, 16);
                
                // Legs
                ctx.fillRect(20, 46, 8, 10);
                ctx.fillRect(36, 46, 8, 10);
            }
            
            // Add subtle outline for better visibility
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.lineWidth = 1;
            ctx.strokeRect(0, 0, 64, 64);
            
            return canvas;
        }

        function downloadCanvas(canvas, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        async function downloadAll() {
            const zip = new JSZip();
            const folder = zip.folder("sprites");
            
            for (const [name, config] of Object.entries(sprites)) {
                const canvas = drawCharacterSprite(name, config);
                const blob = await new Promise(resolve => canvas.toBlob(resolve));
                folder.file(`${name}.png`, blob);
            }
            
            const content = await zip.generateAsync({type: "blob"});
            const link = document.createElement('a');
            link.download = "quest-chronicle-sprites.zip";
            link.href = URL.createObjectURL(content);
            link.click();
        }

        // Generate sprites on load
        window.onload = function() {
            const grid = document.getElementById('sprite-grid');
            
            for (const [name, config] of Object.entries(sprites)) {
                const card = document.createElement('div');
                card.className = 'sprite-card';
                
                const canvas = drawCharacterSprite(name, config);
                canvas.onclick = () => downloadCanvas(canvas, `${name}.png`);
                canvas.style.cursor = 'pointer';
                canvas.title = 'Click to download';
                
                const label = document.createElement('div');
                label.textContent = name.toUpperCase();
                label.style.marginTop = '10px';
                label.style.fontWeight = 'bold';
                
                const downloadBtn = document.createElement('button');
                downloadBtn.textContent = '💾 Download';
                downloadBtn.onclick = () => downloadCanvas(canvas, `${name}.png`);
                
                card.appendChild(canvas);
                card.appendChild(label);
                card.appendChild(downloadBtn);
                grid.appendChild(card);
            }
        };
    </script>
</body>
</html>
